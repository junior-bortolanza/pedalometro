spring:
  application:
    name: weather-api

pedalometro:
  score:
    rain:
      high: 80
      medium: 50
      low: 20
      highPenalty: 50
      mediumPenalty: 30
      lowPenalty: 10
    wind:
      high: 30
      medium: 20
      low: 10
      highPenalty: 40
      mediumPenalty: 25
      lowPenalty: 10
    status:
      excellent: 80
      good: 60
      regular: 40
  client:
    timeout:
      connect: 2000
      read: 2000

resilience4j:
  retry:
    instances:
      externalApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true

  circuitbreaker:
    instances:
      externalApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3